name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-latest
    steps:
      - name: Check out released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Electron runtime
        run: pnpm run electron:install
      - name: Build application
        run: pnpm run build
      - name: Capture documentation screenshots from synthetic files
        id: screenshots
        continue-on-error: true
        timeout-minutes: 3
        run: pnpm run screenshots
      - name: Save screenshots for documentation
        if: steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: documentation-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Assemble portable application
        run: node scripts/pack-portable.cjs
      - name: Test source and packaged application
        env:
          SLOWLOOK_PORTABLE_DIST: build/versions/V1/resources/app/build/dist
        run: pnpm test
      - name: Create archive and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9._-]+$') { throw 'Release tag cannot be used as a filename.' }
          $archive = "QuickLook-Fast-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -LiteralPath build/versions/V1 -DestinationPath "build/$archive" -CompressionLevel Fastest
          $hash = (Get-FileHash -LiteralPath "build/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "build/$archive.sha256" -Value "$hash  $archive" -Encoding ascii
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Attach files to the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" "build/$env:ARCHIVE" "build/$env:ARCHIVE.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Linux ${{ matrix.arch }} portable (GNOME and KDE)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run electron:install
      - run: pnpm run build
      - run: node scripts/pack-portable.cjs
      - name: Smoke-test bundled Electron architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          actual="$(ELECTRON_RUN_AS_NODE=1 build/versions/V1/quicklook-fast -p 'process.versions.electron + ":" + process.arch')"
          expected="$(node -p 'require("./package.json").devDependencies.electron'):$TARGET_ARCH"
          [ "$actual" = "$expected" ] || { echo "Unexpected bundled runtime: $actual (expected $expected)"; exit 1; }
      - name: Test source and packaged application
        env:
          SLOWLOOK_PORTABLE_DIST: build/versions/V1/resources/app/build/dist
        run: pnpm test
      - name: Create archive and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          archive="QuickLook-Fast-$RELEASE_TAG-linux-$TARGET_ARCH.tar.gz"
          tar -czf "build/$archive" -C build/versions V1
          (cd build && sha256sum "$archive" > "$archive.sha256")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Attach files to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "build/$ARCHIVE" "build/$ARCHIVE.sha256" --clobber

  update-manifest:
    name: Create update manifest
    needs: [windows, linux, macos]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Collect uploaded package metadata and attach update.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'if (`v${require("./package.json").version}` !== process.env.RELEASE_TAG) throw new Error("Package version does not match the release tag")'
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > release.json
          node scripts/create-update-manifest.cjs release.json update.json "$GH_REPO" "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" update.json --clobber

  macos:
    name: macOS arm64 portable
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run electron:install
      - run: pnpm run build
      - run: node scripts/pack-portable.cjs
      - name: Ad-hoc sign and verify bundle
        run: |
          codesign --force --deep --sign - "build/versions/V1/QuickLook Fast.app"
          codesign --verify --deep --strict "build/versions/V1/QuickLook Fast.app"
      - name: Smoke-test the bundled arm64 Electron executable
        run: |
          executable="build/versions/V1/QuickLook Fast.app/Contents/MacOS/QuickLook Fast"
          actual="$(ELECTRON_RUN_AS_NODE=1 "$executable" -p 'process.versions.electron + ":" + process.arch')"
          expected="$(node -p 'require("./package.json").devDependencies.electron + ":arm64"')"
          [ "$actual" = "$expected" ] || { echo "Unexpected bundled runtime: $actual (expected $expected)"; exit 1; }
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "build/versions/V1/QuickLook Fast.app/Contents/Info.plist")"
          [ "$minimum" = "26.0" ] || { echo "Unexpected minimum macOS: $minimum"; exit 1; }
      - name: Test source and packaged application
        env:
          SLOWLOOK_PORTABLE_DIST: build/versions/V1/QuickLook Fast.app/Contents/Resources/app/build/dist
        run: pnpm test
      - name: Create archive and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          archive="QuickLook-Fast-$RELEASE_TAG-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent build/versions/V1 "build/$archive"
          (cd build && shasum -a 256 "$archive" > "$archive.sha256")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Attach files to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "build/$ARCHIVE" "build/$ARCHIVE.sha256" --clobber
